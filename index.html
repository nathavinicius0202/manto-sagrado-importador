<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manto Sagrado Importador</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#111;
    color:white;
}

header{

    background:#006400;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;

}

.menu{

    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    flex-wrap:wrap;

}

button{

    padding:12px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;

}

.container{

    padding:20px;

}


.card{

    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;

}


.titulo{

    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;

}


.produto{

    background:#292929;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;

}


.lucro{

    color:#00ff66;
    font-weight:bold;

}


#mensagem{

    margin-top:10px;

}

</style>

</head>


<body>


<header>
Manto Sagrado Importador
</header>


<div class="menu">

<button onclick="inicio()">🏠 Início</button>

<button onclick="carregarProdutos()">📦 Produtos</button>

<button onclick="verLucro()">💰 Lucro</button>

<button onclick="importar()">📥 Importar Catálogo</button>

</div>



<div class="container">


<div class="card">

<div class="titulo">
Página Inicial
</div>


<p>
API Online ✅
</p>


<p>
Total de produtos:
<span id="total">Carregando...</span>
</p>


<p id="hora">
</p>


</div>



<div class="card">

<div class="titulo">
📦 Produtos
</div>


<div id="lista">
Carregando...
</div>


</div>



<div class="card">

<div class="titulo">
💰 Resumo de Lucro
</div>


<div id="lucro">
Clique em Lucro
</div>


</div>


<div id="mensagem"></div>


</div>





<script>


function inicio(){

fetch("/status")

.then(r=>r.json())

.then(d=>{

document.getElementById("total").innerHTML=d.produtos;

document.getElementById("hora").innerHTML=
"Atualizado: "+d.ultima_atualizacao;

});

}





function carregarProdutos(){

fetch("/produtos")

.then(r=>r.json())

.then(produtos=>{


let html="";


produtos.forEach(p=>{


html+=`

<div class="produto">

<h3>${p.nome}</h3>

<p>Categoria: ${p.categoria}</p>

<p>Custo: R$ ${p.custo}</p>

<p>Venda: R$ ${p.preco_venda}</p>

<p class="lucro">
Lucro: R$ ${p.lucro}
</p>

</div>

`;


});


document.getElementById("lista").innerHTML=html;


});

}




function importar(){


document.getElementById("mensagem").innerHTML=
"Importando catálogo... aguarde";


fetch("/importar")

.then(r=>r.json())

.then(d=>{


document.getElementById("mensagem").innerHTML=

d.mensagem+
" Produtos: "+
d.total_produtos;


inicio();

carregarProdutos();


});


}





function verLucro(){


fetch("/lucro")

.then(r=>r.json())

.then(d=>{


document.getElementById("lucro").innerHTML=

`

Investimento: R$ ${d.investimento}

<br>

Faturamento: R$ ${d.faturamento}

<br>

<span class="lucro">
Lucro: R$ ${d.lucro}
</span>

`;

});


}



inicio();

carregarProdutos();


</script>


</body>

</html>
