<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manto Sagrado Importador</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#111;
    color:white;
}

header{
    background:#FFD700;
    color:black;
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.menu{
    display:flex;
    justify-content:space-around;
    background:#1e1e1e;
    padding:15px;
}

.menu button{
    background:none;
    border:none;
    color:white;
    font-size:14px;
    cursor:pointer;
}

.container{
    padding:20px;
}

.card{
    background:#1e1e1e;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.titulo{
    color:#FFD700;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.botao{
    background:#FFD700;
    color:black;
    border:none;
    padding:15px;
    width:100%;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.info{
    margin:10px 0;
}

</style>

</head>

<body>

<header>
Manto Sagrado Importador
</header>

<div class="menu">
    <button>🏠 Início</button>
    <button>📦 Produtos</button>
    <button>💰 Lucro</button>
    <button>⚙️ Configurações</button>
</div>

<div class="container">

    <div class="card">

        <div class="titulo">
            Página Inicial
        </div>

        <div class="info">
            API Online ✅
        </div>

        <div class="info">
            Total de produtos:
            <span id="produtos">Carregando...</span>
        </div>

        <div class="info">
            Última atualização:
            <span id="hora">Carregando...</span>
        </div>

    </div>

    <div class="card">

        <div class="titulo">
            Importar Catálogo
        </div>

        <button class="botao">
            📥 Importar Catálogo
        </button>

    </div>

</div>

<script>

fetch("/status")
.then(resposta => resposta.json())
.then(dados => {

    document.getElementById("produtos").innerText = dados.produtos;

    document.getElementById("hora").innerText =
    dados.ultima_atualizacao;

})
.catch(() => {

    document.getElementById("produtos").innerText = "Erro";

    document.getElementById("hora").innerText = "Erro";

});

</script>

</body>
</html>
