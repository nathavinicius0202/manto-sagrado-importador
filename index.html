<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manto Sagrado Importador</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{background:#0a7a2f;padding:18px;text-align:center;font-size:24px;font-weight:bold}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;background:#1a1a1a}
button{padding:10px 16px;border:0;border-radius:8px;background:#0a7a2f;color:#fff;cursor:pointer}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:#1f1f1f;padding:16px;border-radius:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.prod{background:#2a2a2a;padding:12px;border-radius:10px}
.ok{color:#52ff7a}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;box-sizing:border-box}
</style>
</head>
<body>
<header>Manto Sagrado Importador</header>
<nav>
<button onclick="carregarStatus()">🏠 Início</button>
<button onclick="carregarProdutos()">📦 Produtos</button>
<button onclick="carregarLucro()">💰 Lucro</button>
<button onclick="importarCatalogo(this)">📥 Importar Catálogo</button>
</nav>
<main>
<div class="card">
<h2>Status</h2>
<p id="status">Carregando...</p>
</div>
<div class="card">
<input id="busca" placeholder="Pesquisar produto..." oninput="filtrar()">
</div>
<div class="card">
<h2>Produtos</h2>
<div id="lista" class="grid"></div>
</div>
<div class="card">
<h2>Lucro</h2>
<div id="lucro">Clique em 💰 Lucro</div>
</div>
</main>
<script>
let produtos=[];
async function carregarStatus(){
 const d=await (await fetch('/status')).json();
 document.getElementById('status').innerHTML=`<span class="ok">API Online ✅</span><br>Total: ${d.produtos}<br>Atualização: ${d.ultima_atualizacao}`;
}
function render(lista){
 document.getElementById('lista').innerHTML=lista.map(p=>`
 <div class="prod">

 <h3>${p.nome}</h3>

 <p>${p.categoria}</p>

 <label>Custo:</label>
 <input 
 id="custo-${p.id}" 
 value="${p.custo}"
 type="number">

 <label>Venda:</label>
 <input 
 id="venda-${p.id}" 
 value="${p.preco_venda}"
 type="number">

 <p class="ok">
 Lucro: R$ <span id="lucro-${p.id}">
 ${p.lucro}
 </span>
 </p>

 <button onclick="salvarPreco(${p.id})">
 💾 Salvar
 </button>

 </div>`).join('');
}
 
async function carregarProdutos(){
 produtos=await (await fetch('/produtos')).json();
 render(produtos);
}
function filtrar(){
 const t=document.getElementById('busca').value.toLowerCase();
 render(produtos.filter(p=>p.nome.toLowerCase().includes(t)));
}
async function carregarLucro(){
 const d=await (await fetch('/lucro')).json();
 document.getElementById('lucro').innerHTML=`Investimento: R$ ${d.investimento}<br>Faturamento: R$ ${d.faturamento}<br><span class="ok">Lucro: R$ ${d.lucro}</span>`;
}
async function importarCatalogo(b){
 b.disabled=true;
 b.textContent='Importando...';

 try{
   const d=await (await fetch('/importar')).json();

   alert(d.mensagem + "\nProdutos importados: " + d.total_produtos);

   await carregarStatus();
   await carregarProdutos();

 }catch(e){
   alert('Erro ao importar catálogo');
 }

 b.disabled=false;
 b.textContent='📥 Importar Catálogo';
} 
async function editarPreco(id, custoAtual){

    let novoCusto = prompt(
        "Digite o novo custo:",
        custoAtual
    );

    if(!novoCusto){
        return;
    }

    const resposta = await fetch(
        `/produto/${id}?custo=${novoCusto}`,
        {
            method:"PUT"
        }
    );

    const dados = await resposta.json();

    alert(
        dados.mensagem +
        "\nVenda: R$ " +
        dados.preco_venda +
        "\nLucro: R$ " +
        dados.lucro
    );

    carregarProdutos();
 }
carregarStatus();
carregarProdutos();
</script>
</body>
</html>
