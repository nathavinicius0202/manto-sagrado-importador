<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manto Sagrado Importador</title>

 <link rel="stylesheet" href="style.css">   

</head>

<body>

<header>
Manto Sagrado Importador
</header>

<div class="menu">
    <button onclick="mostrar('inicio')">🏠 Início</button>
    <button onclick="mostrar('produtos')">📦 Produtos</button>
    <button onclick="mostrar('lucro')">💰 Lucro</button>
    <button onclick="mostrar('config')">⚙️ Configurações</button>
</div>
<div class="container">

    <div class="card">

        <div class="titulo">
            Página Inicial
        </div>

        <div class="info">
            API Online ✅
        </div>

        <div class="info">
            Total de produtos:
            <span id="produtos">Carregando...</span>
        </div>

        <div class="info">
            Última atualização:
            <span id="hora">Carregando...</span>
        </div>

    </div>

    <div class="card">

        <div class="titulo">
            Importar Catálogo
        </div>

        <button class="botao">
            📥 Importar Catálogo
        </button>

    </div>
    <div class="card">

    <div class="titulo">
        📦 Produtos
    </div>

    <div id="lista-produtos">
        Carregando produtos...
    </div>

    </div>

</div>

<script>

fetch("/status")
.then(resposta => resposta.json())
.then(dados => {

    document.getElementById("produtos").innerText = dados.produtos;

    document.getElementById("hora").innerText =
    dados.ultima_atualizacao;

})
.catch(() => {

    document.getElementById("produtos").innerText = "Erro";

    document.getElementById("hora").innerText = "Erro";

});
fetch("/produtos")
.then(resposta => resposta.json())
.then(produtos => {

    let lista = "";

    produtos.forEach(produto => {

        lista += `
        <div style="background:#2a2a2a;padding:15px;border-radius:10px;margin-bottom:10px;">
            <h3>${produto.nome}</h3>
            <p>Categoria: ${produto.categoria}</p>
            <p>Preço: R$ ${produto.preco}</p>
        </div>
        `;

    });

    document.getElementById("lista-produtos").innerHTML = lista;

});
</script>

</body>
</html>
